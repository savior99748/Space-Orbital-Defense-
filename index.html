<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ringwarden: Orbital Defense</title>
<meta name="description" content="A space tower defense game across our Solar System. Build satellites on rotating orbit rings around planets and moons.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<style>
  :root {
    --bg: #05060f;
    --panel: #0e1124;
    --panel-2: #161a36;
    --line: #2c3270;
    --text: #e6e9ff;
    --muted: #8b90b8;
    --accent: #6cf0ff;
    --gold: #ffd166;
    --danger: #ff5c7a;
    --good: #7dff9a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  /* pinned to the screen: iOS can leave the page scrolled after rotating, which hid the top bar */
  #app { display: flex; flex-direction: column; position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }

  /* ---------- HUD ---------- */
  #hud { display: flex; gap: 8px 14px; align-items: center; padding: 8px 12px; background: var(--panel);
    border-bottom: 1px solid #222750; flex-wrap: wrap; }
  .stats-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .stat { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat span { color: var(--muted); font-weight: 400; margin-right: 4px; font-size: 13px; }
  .stat .danger { color: var(--danger); }
  #diffTag:empty { display: none; }
  #diffTag { font-size: 12px; font-weight: 700; border: 1px solid currentColor; border-radius: 99px; padding: 1px 8px; }
  .controls { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; touch-action: manipulation; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #1b3d5c; border-color: var(--accent); font-weight: 600; }
  button.on { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 10px rgba(255,209,102,.35); }
  button.danger { border-color: #6b2a3a; }

  /* ---------- stage ---------- */
  #stage { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  canvas#game { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
  #preview { position: absolute; left: 8px; bottom: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap;
    align-items: center; pointer-events: none; font-size: 12px; }
  .pv-label { color: var(--muted); margin-right: 2px; }
  .chip { background: rgba(14,17,36,.85); border: 1px solid #2c3270; border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
  .chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  #toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(14,17,36,.94);
    border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; font-size: 14px; pointer-events: none;
    opacity: 0; transition: opacity .3s; max-width: min(520px, calc(100% - 24px)); text-align: center; line-height: 1.35; }

  /* ---------- tower info / upgrades ---------- */
  #info { position: absolute; right: 10px; top: 10px; width: 300px; max-height: calc(100% - 20px); overflow-y: auto;
    background: rgba(14,17,36,.96); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    display: none; font-size: 13px; }
  #info.open { display: block; }
  .info-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .info-head canvas { width: 60px; height: 60px; background: #0a0d1f; border-radius: 10px; flex: none; }
  .info-head h3 { margin: 0; font-size: 16px; }
  .info-head .sub { color: var(--muted); font-size: 12px; }
  .info-head .close { margin-left: auto; padding: 4px 10px; align-self: flex-start; }
  .stats .row { display: flex; justify-content: space-between; color: var(--muted); padding: 2px 0; }
  .stats .row b { color: var(--text); }
  .stats em { color: var(--good); font-style: normal; }
  .ups { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .choose { color: var(--gold); font-weight: 600; font-size: 12px; }
  .path-desc { font-weight: 700; font-size: 12px; margin-top: 4px; }
  .path-desc span { color: var(--muted); font-weight: 400; }
  .up-card { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%;
    border-color: var(--c); background: linear-gradient(90deg, rgba(255,255,255,.04), transparent); }
  .up-card canvas { width: 44px; height: 44px; background: #0a0d1f; border-radius: 8px; flex: none; }
  .up-card b { display: block; color: var(--c); }
  .up-card small { display: block; color: var(--muted); font-size: 11px; line-height: 1.3; }
  .up-card .cost { color: var(--gold); font-size: 12px; font-weight: 700; }
  .maxed { text-align: center; font-weight: 700; padding: 6px; }
  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .actions button { flex: 1; font-size: 12px; padding: 7px 6px; }

  /* ---------- shop ---------- */
  #shop { display: flex; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--panel);
    border-top: 1px solid #222750; overflow-x: auto; scrollbar-width: thin; }
  .tower-btn { position: relative; display: flex; align-items: center; gap: 6px; min-width: 168px; text-align: left; padding: 5px 8px 5px 4px; flex: none; }
  .tower-btn canvas { width: 52px; height: 52px; flex: none; }
  .mode-3d .tower-btn canvas { background: radial-gradient(circle, #1d2a5c 0%, #0a0d1f00 70%); border-radius: 10px; }
  .oc-icon { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 8px; background: #2a2208; color: #ffd166; font-weight: 800; font-size: 15px; }
  .asc-card .oc-icon { background: #1e1230; color: #d6b4ff; }
  .tower-btn .tb-text { display: flex; flex-direction: column; }
  .tower-btn .lock { display: none; }
  .tower-btn.locked { cursor: not-allowed; }
  .tower-btn.locked > canvas, .tower-btn.locked > .tb-text, .tower-btn.locked > kbd { visibility: hidden; }
  .tower-btn.locked .lock { display: flex; flex-direction: column; position: absolute; inset: 0; align-items: center; justify-content: center; gap: 2px; color: var(--muted); }
  .tower-btn.locked .lock small { display: block !important; }
  .tower-btn.locked .lock b { font-size: 26px; color: #8a93c8; }
  .tower-btn.locked .lock small { font-size: 12px; }
  .tower-btn.new { animation: wave-ready 1.1s ease-in-out infinite alternate; }
  .tower-btn b { font-size: 13px; }
  .tower-btn small { color: var(--muted); font-size: 11px; }
  .tower-btn .cost { color: var(--gold); font-size: 12px; font-weight: 700; }
  .tower-btn kbd { position: absolute; top: 3px; right: 5px; font-size: 10px; color: var(--muted); font-family: inherit; }
  .tower-btn.selected { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, 0 0 12px rgba(255,209,102,.3); }
  .tower-btn.poor { opacity: .5; }
  .tower-btn.poor .cost { color: var(--danger); }

  /* ---------- overlay menus ---------- */
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,6,15,.8); z-index: 5; overflow-y: auto; padding: 12px; }
  #overlay .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px;
    max-width: 480px; width: 100%; text-align: center; margin: auto; }
  #overlay h1 { margin: 0 0 8px; letter-spacing: 3px; color: var(--accent); font-size: 28px; }
  #overlay p { color: #c2c6e6; line-height: 1.5; margin: 8px 0; }
  .muted { color: var(--muted) !important; }
  .btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .btns.sound button { font-size: 13px; }
  .diffs { display: flex; flex-direction: column; gap: 8px; margin: 16px 0 4px; }
  .diff { text-align: left; border-color: var(--c); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
  .diff b { color: var(--c); font-size: 16px; }
  .diff small { color: #c2c6e6; font-size: 12px; }
  details { text-align: left; margin-top: 14px; color: #c2c6e6; font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); }
  details li { margin: 4px 0; }
  .hidden { display: none !important; }
  body.in-menu #hud, body.in-menu #shop, body.in-menu #zoomCtl, body.in-menu #v3ctl { display: none !important; }

  /* ---------- 3D view ---------- */
  .mode-3d canvas#game { opacity: 0; pointer-events: none; }
  canvas#game3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .mode-3d #zoomCtl { display: none !important; }
  #v3ctl { display: none; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); flex-direction: column; gap: 4px; z-index: 2; }
  .mode-3d #v3ctl { display: flex; }
  #v3ctl button { width: 42px; height: 42px; padding: 0; font-size: 22px; line-height: 1; background: rgba(22,26,54,.88); }
  #info.open ~ #v3ctl { display: none !important; }
  .view-row { display: flex; gap: 6px; justify-content: center; align-items: center; margin: 4px 0 10px; flex-wrap: wrap; }

  /* ---------- zoom controls ---------- */
  #zoomCtl { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  #zoomCtl button { width: 42px; height: 42px; padding: 0; font-size: 22px; line-height: 1; background: rgba(22,26,54,.88); }
  #zoomCtl #zoomLabel { font-size: 12px; height: 28px; }
  #info.open ~ #zoomCtl { display: none; }

  /* ---------- tutorial ---------- */
  #coach { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: min(460px, calc(100% - 80px));
    background: rgba(14,17,36,.97); border: 1px solid var(--gold); border-radius: 12px; padding: 12px 14px; z-index: 4;
    box-shadow: 0 6px 30px rgba(0,0,0,.5), 0 0 18px rgba(255,209,102,.18); font-size: 14px; line-height: 1.45; }
  #coachText b { color: var(--gold); }
  .coach-btns { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .coach-btns .skip { background: transparent; border-color: transparent; color: var(--muted); padding: 4px 6px; font-size: 12px; text-decoration: underline; }
  #coachStep { color: var(--muted); font-size: 12px; margin-left: auto; }
  #coachArrow { position: fixed; z-index: 30; pointer-events: none; color: var(--gold); font-size: 26px; line-height: 1;
    transform: translate(-50%, -100%); text-shadow: 0 0 10px rgba(255,209,102,.8); animation: coach-bob .8s ease-in-out infinite alternate; }
  #coachArrow.up { transform: translate(-50%, 0) rotate(180deg); }
  @keyframes coach-bob { from { margin-top: -6px; } to { margin-top: 4px; } }
  .coach-glow { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(255,209,102,.7) !important; animation: coach-glow 1s ease-in-out infinite alternate; }
  @keyframes coach-glow { from { filter: brightness(1); } to { filter: brightness(1.35); } }
  body.tutorial #preview, body.tutorial #toast { display: none; }
  button.ad { border-color: #3fbf7f; color: #9dffc9; }
  .fake-ad { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; }
  .fake-ad div { display: flex; flex-direction: column; gap: 6px; align-items: center; border: 2px dashed #3fbf7f; padding: 30px 40px; border-radius: 12px; }
  .fake-ad b { font-size: 22px; color: #9dffc9; }
  .fake-ad span { color: var(--muted); }
  .resume { display: flex; gap: 6px; margin: 12px 0 4px; }
  .resume button.primary { flex: 1; font-size: 15px; padding: 10px; }
  .resume button.primary.big { font-size: 17px; padding: 14px 10px; box-shadow: 0 0 0 1px #6cf0ff, 0 0 18px rgba(108,240,255,.35); }
  #waveBtn.ready { animation: wave-ready 1.1s ease-in-out infinite alternate; }
  @keyframes wave-ready { from { box-shadow: 0 0 0 1px #6cf0ff, 0 0 6px rgba(108,240,255,.35); } to { box-shadow: 0 0 0 2px #bff8ff, 0 0 22px rgba(108,240,255,.85); filter: brightness(1.15); } }
  #money.flash { display: inline-block; animation: money-flash .9s ease-out; }
  @keyframes money-flash { 0% { transform: scale(1); } 25% { transform: scale(1.35); text-shadow: 0 0 14px #ffd166; } 100% { transform: scale(1); } }
  .chip.goal { border-color: #ffd166; color: #ffe6a8; }
  @media (prefers-reduced-motion: reduce) { #waveBtn.ready, #money.flash { animation: none; } }
  .version a { color: var(--muted); }
  /* ---------- endless + leaderboards ---------- */
  .mode-row { display: flex; gap: 8px; margin-top: 8px; }
  .mode-btn { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .mode-btn b { color: var(--accent); }
  .mode-btn small { color: var(--muted); font-size: 11px; }
  .mode-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, 0 0 12px rgba(108,240,255,.25); }
  .milestones { font-size: 13px; color: var(--muted); display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .milestones .ms { border: 1px solid #3a3f6e; border-radius: 99px; padding: 1px 9px; }
  .milestones .ms.got { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 8px rgba(255,209,102,.35); }
  .chip.milestone { border-color: var(--gold); color: var(--gold); }
  .map-card .eb { position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--accent); font-weight: 700; }
  table.lb { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; font-variant-numeric: tabular-nums; }
  table.lb th { color: var(--muted); font-weight: 500; font-size: 12px; text-align: left; padding: 4px 6px; border-bottom: 1px solid #2c3270; }
  table.lb td { padding: 6px; border-bottom: 1px solid #191d3d; text-align: left; }
  table.lb tr.me td { background: rgba(255,209,102,.12); color: var(--gold); }
  .lb-maps { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 12px 0 4px; }
  .chip-btn { padding: 5px 10px; font-size: 13px; border-radius: 99px; }
  .chip-btn small { color: var(--accent); }
  .chip-btn.selected { border-color: var(--accent); color: var(--accent); }
  .nick { display: flex; gap: 6px; justify-content: center; margin: 8px 0; }
  .nick input { font: inherit; color: var(--text); background: #0a0d1f; border: 1px solid var(--gold); border-radius: 8px; padding: 7px 10px; width: min(240px, 60vw); user-select: text; -webkit-user-select: text; }
  .ach { list-style: none; padding: 0; }
  .ach li { opacity: .55; }
  .ach li.got { opacity: 1; }
  .ach li span { color: var(--muted); }
  #overlay .card.wide { max-width: 760px; }
  .small { font-size: 12px; }

  /* ---------- main menu ---------- */
  .maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 14px 0 10px; }
  .map-card { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px 7px; position: relative; }
  .map-card canvas { width: 100%; max-width: 140px; aspect-ratio: 7 / 5; }
  .map-card b { font-size: 14px; }
  .map-card small { color: var(--muted); font-size: 11px; }
  .map-card.selected { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, 0 0 14px rgba(255,209,102,.3); }
  .map-card.final { grid-column: span 2; border-color: #7a4a1a; background: linear-gradient(180deg, #2a1608, var(--panel-2)); }
  .map-card.final.selected { border-color: var(--gold); }
  .medals { display: flex; gap: 4px; margin-top: 3px; }
  .medal { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--c); opacity: .5; }
  .medal.won { background: var(--c); opacity: 1; box-shadow: 0 0 6px var(--c); }
  .map-detail { text-align: left; background: rgba(255,255,255,.03); border: 1px solid #222750; border-radius: 10px; padding: 10px 14px; }
  .map-detail h2 { margin: 0 0 4px; font-size: 18px; }
  .map-detail p { margin: 4px 0 !important; font-size: 14px; }
  .map-detail .feature { color: var(--gold) !important; }
  .stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
  .tier-tag { display: inline-block; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); font-size: 11px; font-weight: 700; letter-spacing: .3px; white-space: nowrap; background: color-mix(in srgb, var(--c) 12%, transparent); }
  .tier-tag.big { font-size: 13px; padding: 2px 10px; vertical-align: middle; }
  .diff-row { display: flex; gap: 8px; margin-top: 12px; }
  .diff-btn { flex: 1; display: flex; flex-direction: column; align-items: center; border-color: #2c3270; }
  .diff-btn b { color: var(--c); }
  .diff-btn small { color: var(--muted); font-size: 11px; }
  .diff-btn.selected { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset, 0 0 12px color-mix(in srgb, var(--c) 35%, transparent); }
  button.big { font-size: 17px; padding: 11px 28px; }

  /* ---------- stats screen ---------- */
  .newbest { color: var(--gold) !important; font-weight: 700; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
  .tile { background: rgba(255,255,255,.04); border: 1px solid #222750; border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; }
  .tile b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 11px; }
  .rep-title { margin: 14px 0 6px; text-align: left; font-size: 15px; }
  .report { display: flex; flex-direction: column; gap: 4px; text-align: left; }
  .rep-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px; align-items: center;
    background: rgba(255,255,255,.03); border-radius: 8px; padding: 3px 8px 3px 3px; }
  .rep-row canvas { width: 34px; height: 34px; }
  .rep-name { display: flex; flex-direction: column; min-width: 0; }
  .rep-name b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rep-name small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rep-bar { position: relative; height: 22px; background: rgba(0,0,0,.35); border-radius: 6px; overflow: hidden; }
  .rep-bar i { position: absolute; left: 0; top: 0; bottom: 0; opacity: .45; border-radius: 6px; }
  .rep-bar span { position: relative; font-size: 11.5px; line-height: 22px; padding-left: 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- phones ---------- */
  @media (max-width: 720px) {
    #hud { padding: 6px 8px; gap: 6px; }
    .stats-row { gap: 10px; width: 100%; justify-content: space-between; }
    .stat { font-size: 14px; }
    .stat span { font-size: 11px; }
    .stat.score { display: none; }
    .controls { width: 100%; margin-left: 0; }
    .controls button { padding: 7px 8px; font-size: 13px; flex: 1; }
    .controls #waveBtn { flex: 2; }
    #shop { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 5px; }
    .tower-btn { min-width: 0; flex-direction: column; gap: 0; padding: 4px 6px; width: 74px; text-align: center; }
    .tower-btn canvas { width: 46px; height: 46px; }
    .tower-btn .tb-text { align-items: center; }
    .tower-btn b { font-size: 10.5px; line-height: 1.15; }
    .tower-btn small, .tower-btn kbd { display: none; }
    #info { left: 6px; right: 6px; top: auto; bottom: 6px; width: auto; max-height: 56%; padding: 10px; font-size: 12px; }
    #info .stats { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; }
    .info-head { margin-bottom: 4px; }
    .info-head canvas { width: 40px; height: 40px; }
    .up-card { padding: 5px 8px; }
    .up-card canvas { width: 36px; height: 36px; }
    #preview { bottom: auto; top: 6px; font-size: 11px; }
    #info.open ~ #preview { display: none; }
    #zoomCtl { right: 6px; }
    #zoomCtl button { width: 40px; height: 40px; }
    #coach { width: calc(100% - 64px); left: 8px; transform: none; font-size: 13px; padding: 10px 12px; }
    #toast { top: 40px; font-size: 13px; }
    #overlay .card { padding: 18px; }
    #overlay h1 { font-size: 22px; }
    .maps { grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .map-card { padding: 4px 2px 5px; }
    .map-card b { font-size: 12px; }
    .map-card small { font-size: 10px; }
    .map-card.final { grid-column: span 3; }
    .map-card.final canvas { max-width: 120px; }
    .tiles { gap: 4px; }
    .tile b { font-size: 15px; }
    .rep-row { grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
    .rep-row canvas { width: 30px; height: 30px; }
  }

/* RINGWARDEN VISUAL REFRESH v1 — non-destructive UI layer.
   Performance: no backdrop blur, canvas filters or large shadows over the live game view (each costs frame rate). */
:root {--bg:#030916;--panel:#09172a;--panel-2:#112640;--line:#285477;--text:#ecf8ff;--muted:#91abc4;--accent:#54e7ff;--gold:#ffca62;--danger:#ff527b;--good:#65f5b0}
html,body{background:#030916;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif} /* plain: a gradient here slows the 3D view; menus keep theirs */
button{transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:not(:disabled):active{transform:scale(.975)}
#hud{background:linear-gradient(180deg,rgba(12,30,52,.98),rgba(6,17,32,.96));border-bottom:1px solid rgba(84,231,255,.28)}
#hud .stat{letter-spacing:.02em;text-shadow:0 1px 9px #0008}
#hud .stat span{color:#95b3c9}
#shop{background:linear-gradient(0deg,#081629,#10233c);border-top:1px solid rgba(84,231,255,.28)}
.tower-btn{background:linear-gradient(145deg,rgba(24,49,76,.95),rgba(8,19,39,.98));border:1px solid #315574;border-radius:12px;box-shadow:inset 0 1px 0 #ffffff12,0 4px 12px #0005}
.tower-btn:hover{border-color:#60dff5;background:linear-gradient(145deg,#1b4464,#0a2038)}
.tower-btn.selected{border-color:#ffcf70;box-shadow:0 0 0 1px #ffcf70 inset,0 0 22px #ffb94445,inset 0 1px 0 #fff4}
.tower-btn .cost{color:#ffcf70}
#overlay{background:radial-gradient(ellipse at 50% 35%,rgba(12,43,75,.87),rgba(2,7,18,.96) 74%)}
#overlay .card{background:linear-gradient(155deg,rgba(17,38,65,.98),rgba(6,15,31,.98));border:1px solid #3c7293;border-radius:18px;box-shadow:0 25px 90px #000b,0 0 45px #2b9bc61b,inset 0 1px 0 #ffffff22}
#overlay h1{color:#e9faff;text-shadow:0 0 25px #3ddcff77;letter-spacing:.12em;font-weight:900}
#overlay p{color:#afc5d9}
#overlay .primary,button.primary{background:linear-gradient(115deg,#12658b,#174569);border-color:#62e7ff;color:#f0fcff;box-shadow:inset 0 1px 0 #ffffff40,0 0 15px #21d7ff22;font-weight:800}
#overlay .primary:hover,button.primary:hover{background:linear-gradient(115deg,#187da6,#205f88);box-shadow:0 0 24px #25d8ff55}
.map-card{background:linear-gradient(160deg,#152c47,#0a1930);border:1px solid #315577;border-radius:12px;box-shadow:inset 0 1px 0 #ffffff12}
.map-card:hover{border-color:#65d8ef;background:linear-gradient(160deg,#1b3c5a,#102640)}
.map-card.selected{border-color:#62e9ff;box-shadow:0 0 0 1px #62e9ff inset,0 0 19px #2bd6ff50}
.map-card.final{background:linear-gradient(145deg,#382411,#10223c);border-color:#a97635}
.map-detail{background:linear-gradient(135deg,#10243e,#0b182e);border-color:#345d80;border-radius:12px}
.diff-btn,.mode-btn,.up-card,.tile{background:linear-gradient(145deg,#162c48,#0a1b32);border-radius:10px}
#info{background:linear-gradient(145deg,rgba(15,39,65,.98),rgba(6,17,33,.98));border:1px solid #3a7594;box-shadow:0 15px 45px #0009,0 0 25px #00cfff16;border-radius:14px}
#v3ctl button,#zoomCtl button{background:rgba(13,35,59,.94);border-color:#38708b;box-shadow:0 4px 14px #0008}
#preview .chip{background:rgba(7,24,42,.92);border-color:#386782} /* no backdrop blur: it re-blurs the moving game view every frame */
@media(max-width:720px){#overlay .card{border-radius:14px}#shop{gap:5px}.tower-btn{border-radius:9px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
/* 2D visual upgrade: icons sit on a spotlight like the 3D view, clearer card states, stronger wave banners */
.tower-btn canvas,.up-card canvas{background:radial-gradient(circle at 50% 45%,#22365e 0%,#101c38 45%,#0a0d1f00 72%);border-radius:10px}
.up-card{border:1px solid #2f5170;box-shadow:inset 0 1px 0 #ffffff10}
.up-card:not(:disabled):hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset,0 0 16px #0007,inset 0 1px 0 #ffffff22}
.up-card:disabled{opacity:.55;filter:saturate(.7)}
.up-card:disabled .cost{color:#c98f8f}
#toast{background:linear-gradient(180deg,rgba(18,40,66,.97),rgba(8,19,36,.97));border:1px solid #4a86a8;box-shadow:0 8px 28px #0009,0 0 22px #27c8ff22;text-shadow:0 1px 2px #000a;font-weight:600}
.tower-btn.selected canvas{background:radial-gradient(circle at 50% 45%,#5a4720 0%,#2a2210 45%,#0a0d1f00 72%)}
#overlay h1 + .subtitle{margin:-6px 0 10px;font-size:13px;font-weight:700;letter-spacing:.42em;color:#7fdcf2}
/* cinematic 3D menu: the live scene shows through a holographic panel */
.mode-3d body.in-menu #overlay{background:radial-gradient(ellipse at 50% 45%,rgba(3,9,22,.05),rgba(2,6,16,.62) 78%)}
.mode-3d body.in-menu #overlay .card{background:linear-gradient(160deg,rgba(12,30,52,.84),rgba(4,12,26,.9));border-color:rgba(98,233,255,.42)}
#overlay .card{position:relative}
#overlay .card::before,#overlay .card::after{content:"";position:absolute;width:22px;height:22px;pointer-events:none;border:2px solid #62e9ff;opacity:.8}
#overlay .card::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-top-left-radius:16px}
#overlay .card::after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-bottom-right-radius:16px}
#overlay h1{font-size:40px;background:linear-gradient(180deg,#ffffff,#9eeeff 55%,#3fc6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #2fd0ff66)}
.map-card canvas{background:radial-gradient(circle at 50% 50%,#13294a 0%,rgba(10,25,48,0) 70%)}
@media(max-width:720px){#overlay h1{font-size:30px}}
/* Command interface (merged from the visual-upgrade ZIP, phases 6-7; without its backdrop blur and
   drop-shadow filters, which cost frame rate over the live 3D view). */
#overlay .rw-eyebrow{color:#70d9fa;font-size:10px;letter-spacing:.35em;font-weight:800;margin:0 0 6px}
#overlay button.primary{background:linear-gradient(115deg,#087cbd,#10bde0);color:#f8ffff;border-color:#67dfff;box-shadow:0 0 22px rgba(7,159,236,.18)}
#overlay button.primary:hover:not(:disabled){background:linear-gradient(115deg,#0b8fd8,#22cdf0)}
@media(hover:hover){#overlay button:hover:not(:disabled),.tower-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(13,171,240,.17)}}
button:not(:disabled):active{transform:translateY(0) scale(.97)}
button:disabled{opacity:.42;filter:saturate(.4);cursor:not-allowed}
button.on,.diff-btn.selected,.mode-btn.selected{box-shadow:inset 0 0 0 1px currentColor,0 0 14px rgba(98,233,255,.22)}
#overlay .map-card{background:radial-gradient(ellipse at 50% 12%,rgba(31,75,120,.55),rgba(7,15,34,.95) 72%);border:1px solid rgba(100,160,211,.3);border-radius:13px;overflow:hidden}
#overlay .map-card.selected{border-color:#6de8ff;box-shadow:inset 0 0 0 1px #6de8ff,0 0 20px rgba(35,197,245,.24)}
#overlay .map-card.final{background:radial-gradient(ellipse at 50% 12%,rgba(120,80,30,.5),rgba(16,22,40,.95) 72%);border-color:rgba(214,150,70,.55)}
#overlay .map-detail{border:1px solid rgba(94,161,215,.28);background:linear-gradient(90deg,rgba(23,51,86,.45),rgba(8,18,36,.2));border-radius:12px}
.tower-btn.selected{border-color:#76e8ff;box-shadow:inset 0 0 0 1px #76e8ff,0 0 17px rgba(45,189,247,.3)}
#overlay .card{animation:rwIn .28s ease-out}
.map-globe{float:right;width:132px;height:132px;margin:-6px -4px 0 12px;shape-outside:circle(50%)}
@media(max-width:560px){.map-globe{width:96px;height:96px}}
@keyframes rwIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#overlay .card{animation:none}#overlay button,.tower-btn,button{transition:none}#overlay button:hover:not(:disabled),.tower-btn:hover:not(:disabled){transform:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stats-row">
      <div class="stat"><span>Wave</span><b id="wave">0</b></div>
      <div class="stat"><span id="livesLabel">Planet</span><b id="lives">0</b></div>
      <div class="stat"><span>Credits</span><b id="money" style="color:var(--gold)">0</b></div>
      <div class="stat score"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><b id="diffTag"></b></div>
    </div>
    <div class="controls">
      <button id="adBtn" class="ad hidden" title="Watch a short ad for bonus credits">📺</button>
      <button id="odBtn" title="Overdrive (Q)">⚡ Overdrive</button>
      <button id="autoBtn" title="Auto-start next wave">Auto</button>
      <button id="speedBtn" title="Game speed (F)">1×</button>
      <button id="menuBtn" title="Pause / menu (P)">❚❚</button>
      <button id="waveBtn" class="primary" title="Start next wave (Space)">Launch Wave ▶</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="info"></div>
    <div id="preview"></div>
    <div id="toast"></div>
    <div id="v3ctl" aria-label="View">
      <button id="v3in" title="Zoom in">+</button>
      <button id="v3reset" title="Reset view">⟲</button>
      <button id="v3out" title="Zoom out">−</button>
    </div>
    <div id="zoomCtl" aria-label="Zoom">
      <button id="zoomIn" title="Zoom in (+)">+</button>
      <button id="zoomLabel" title="Reset zoom (0)">1×</button>
      <button id="zoomOut" title="Zoom out (−)">−</button>
    </div>
    <div id="coach" class="hidden">
      <div id="coachText"></div>
      <div class="coach-btns">
        <button class="small skip" data-tut="skip">Skip tutorial</button>
        <span id="coachStep"></span>
        <button id="coachNext" class="primary" data-tut="next">Next</button>
      </div>
    </div>
    <div id="overlay" class="hidden"></div>
  </div>
  <div id="shop"></div>
</div>
<div id="coachArrow" class="hidden">▼</div>
<!-- PLATFORM: the build script injects platform settings / SDK tags here -->
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/maps.js"></script>
<script src="js/maps3d.js"></script>
<script src="js/mode.js"></script>
<script src="js/audio.js"></script>
<script src="js/platform.js"></script>
<!-- platform adapters: the build keeps only the one for its target (tools/build.mjs) -->
<script src="js/platform/crazygames.js"></script>
<script src="js/platform/capacitor.js"></script>
<script src="js/platform/electron.js"></script>
<script src="js/monetization.js"></script>
<script src="js/analytics.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/draw.js"></script>
<script src="js/fx2d.js"></script>
<script src="js/bodies.js"></script>
<script src="js/game.js"></script>
<script>
  // 3D view: load Three.js + the 3D renderer. If that fails (e.g. opened from a file), fall back to Classic 2D.
  if (OD.is3D && !OD.headless) import("./js/view3d.js").catch(err => { console.warn("3D view unavailable, using Classic 2D", err); OD.setView("2d"); });
</script>
</body>
</html>
