# Runs the automated test suite on every pull request and every push to main.
# A failing check blocks the merge once branch protection requires it (Settings → Branches).
name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install the desktop (Electron) edition for its test
        run: npm ci --prefix platforms/electron --no-audit --no-fund
      - name: Run tests
        run: xvfb-run -a npm test
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/.out/
          retention-days: 14
