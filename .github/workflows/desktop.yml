# Builds the Windows installer and the Steam upload folder for the desktop edition on a Windows machine.
# Run it any time: Actions → "Desktop build" → Run workflow, then download the installer from the run's
# Artifacts. A tag like steam-v1.0.0 also builds it and attaches it to that GitHub release.
name: Desktop build
on:
  workflow_dispatch:
  push:
    tags: ["steam-v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
        working-directory: platforms/electron
      - name: Build the Windows installer
        run: npm run dist:win
        working-directory: platforms/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build; code signing is a later decision
      - uses: actions/upload-artifact@v4
        with:
          name: ringwarden-windows-installer
          path: platforms/electron/release/*.exe
          retention-days: 30
      # Steam installs games itself: it gets the unpacked game folder, not the installer (see tools/steam/README.md)
      - uses: actions/upload-artifact@v4
        with:
          name: ringwarden-steam-windows
          path: platforms/electron/release/win-unpacked/
          retention-days: 30
      - name: Attach to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Steam / desktop build from $GITHUB_SHA."
          gh release upload "$GITHUB_REF_NAME" platforms/electron/release/*.exe --clobber
